<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Logs | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .log-entry {
            display: grid;
            grid-template-columns: 180px 100px 1fr 120px;
            gap: 20px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            transition: background 0.3s;
        }
        .log-entry:hover {
            background: rgba(15, 23, 42, 0.02);
        }
        .log-time {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-family: monospace;
        }
        .log-type {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 8px;
            border-radius: 6px;
            text-align: center;
        }
        .type-info { background: rgba(37, 99, 235, 0.1); color: var(--accent-blue); }
        .type-success { background: rgba(5, 150, 105, 0.1); color: var(--accent-green); }
        .type-warning { background: rgba(217, 119, 6, 0.1); color: var(--accent-orange); }
        .type-error { background: rgba(220, 38, 38, 0.1); color: var(--accent-red); }

        .log-message {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        .log-user {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <ion-icon name="globe"></ion-icon>
                </div>
                <h2 id="sidebar-brand-name">abdsite</h2>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav-container">
                <!-- Nav items dynamically injected by JS to maintain context (Super Admin vs Admin) -->
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='../login.html'">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="log-search" placeholder="Filter logs by message or user..." onkeyup="renderLogs()">
                </div>
                <div class="header-actions">
                    <button class="notification-btn"><ion-icon name="notifications-outline"></ion-icon><span class="badge">0</span></button>
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=random&color=fff" alt="Admin" class="avatar">
                        <div class="profile-info"><span class="name">Admin User</span><span class="role">Super Admin</span></div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="header-title" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px;">
                    <div>
                        <h1>System Audit Logs</h1>
                        <p>Comprehensive record of all administrative actions and automated system events.</p>
                    </div>
                    <button class="btn-danger" onclick="clearLogs()" style="display:inline-flex; align-items:center; gap:6px;">
                        <ion-icon name="trash-outline"></ion-icon>Clear All Logs
                    </button>
                </div>

                <div class="glass-card" style="padding:0; overflow:hidden;">
                    <div class="log-header" style="display:grid; grid-template-columns: 180px 100px 1fr 120px; gap:20px; padding:16px 24px; background:rgba(15,23,42,0.05); font-weight:700; font-size:0.75rem; text-transform:uppercase; color:var(--text-muted); border-bottom:1px solid var(--border-color);">
                        <span>Timestamp</span>
                        <span>Type</span>
                        <span>Event Description</span>
                        <span>Executor</span>
                    </div>
                    <div id="logs-container" style="max-height: 700px; overflow-y:auto;">
                        <!-- Logs dynamically loaded -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/main.js"></script>
    <script>
        function renderSidebar() {
            const navContainer = document.getElementById('sidebar-nav-container');
            const user = JSON.parse(localStorage.getItem('compete_logged_in_user') || '{"role":"admin"}');

            let navHTML = '';

            if (user.role === 'super' || user.role === 'super-admin') {
                navHTML = `
                    <a href="super-admin.html" class="nav-item">
                        <ion-icon name="globe-outline"></ion-icon>
                        <span>System Overview</span>
                    </a>
                    <a href="super-competitions.html" class="nav-item">
                        <ion-icon name="trophy-outline"></ion-icon>
                        <span>Global Competitions</span>
                    </a>
                    <a href="../admin/user-management.html" class="nav-item">
                        <ion-icon name="shield-checkmark-outline"></ion-icon>
                        <span>Manage Managers</span>
                    </a>
                    <a href="system-logs.html" class="nav-item active">
                        <ion-icon name="list-outline"></ion-icon>
                        <span>System Logs</span>
                    </a>
                    <a href="global-settings.html" class="nav-item">
                        <ion-icon name="cog-outline"></ion-icon>
                        <span>Global Settings</span>
                    </a>
                `;
            } else {
                navHTML = `
                    <a href="../admin/admin.html" class="nav-item">
                        <ion-icon name="grid-outline"></ion-icon>
                        <span>Overview</span>
                    </a>
                    <a href="../admin/competitions.html" class="nav-item">
                        <ion-icon name="trophy-outline"></ion-icon>
                        <span>Competitions</span>
                    </a>
                    <a href="../admin/teams.html" class="nav-item">
                        <ion-icon name="people-circle-outline"></ion-icon>
                        <span>House Teams</span>
                    </a>
                    <a href="../admin/user-management.html" class="nav-item">
                        <ion-icon name="person-add-outline"></ion-icon>
                        <span>Manage Managers</span>
                    </a>
                    <a href="../admin/judge-management.html" class="nav-item">
                        <ion-icon name="medal-outline"></ion-icon>
                        <span>Manage Judges</span>
                    </a>
                    <a href="../admin/participants.html" class="nav-item">
                        <ion-icon name="people-outline"></ion-icon>
                        <span>Participants</span>
                    </a>
                    <a href="../admin/results.html" class="nav-item">
                        <ion-icon name="podium-outline"></ion-icon>
                        <span>Scoring Desk</span>
                    </a>
                    <a href="../admin/data-management.html" class="nav-item">
                        <ion-icon name="server-outline"></ion-icon>
                        <span>Data Management</span>
                    </a>
                    <a href="system-logs.html" class="nav-item active">
                        <ion-icon name="list-outline"></ion-icon>
                        <span>System Logs</span>
                    </a>
                    <a href="../admin/settings.html" class="nav-item">
                        <ion-icon name="settings-outline"></ion-icon>
                        <span>Settings</span>
                    </a>
                `;
            }

            navContainer.innerHTML = navHTML;
        }

        function renderLogs() {
            const container = document.getElementById('logs-container');
            const search = document.getElementById('log-search').value.toLowerCase();
            const logs = JSON.parse(localStorage.getItem('compete_audit_trail') || '[]');

            container.innerHTML = '';

            if (logs.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:100px; color:var(--text-muted);">
                    <ion-icon name="document-text-outline" style="font-size:3rem; opacity:0.3;"></ion-icon>
                    <p style="margin-top:16px; font-weight:500;">No system logs recorded yet.</p>
                </div>`;
                return;
            }

            const filtered = logs.filter(l =>
                l.message.toLowerCase().includes(search) ||
                l.user.toLowerCase().includes(search)
            );

            filtered.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.innerHTML = `
                    <div class="log-time">${log.timestamp}</div>
                    <div><span class="log-type type-${log.type}">${log.type}</span></div>
                    <div class="log-message">${log.message}</div>
                    <div class="log-user">${log.user}</div>
                `;
                container.appendChild(div);
            });
        }

        function clearLogs() {
            if (confirm("Permanently delete all system audit logs? This action cannot be undone.")) {
                localStorage.setItem('compete_audit_trail', '[]');
                renderLogs();
            }
        }

        // Apply branding from settings
        document.addEventListener('DOMContentLoaded', () => {
            const brand = localStorage.getItem('compete_platform_name') || 'abdsite';
            document.getElementById('sidebar-brand-name').textContent = brand;
            renderSidebar();
            renderLogs();
        });
    </script>
</body>
</html>
