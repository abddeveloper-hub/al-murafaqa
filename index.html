      }

    ::-webkit-scrollbar {
      display: none;
    }

    /* Infinite continuous left-slide marquee (repeating without stopping) */
    @keyframes slideLeftInfinite {
      0% {
        transform: translate3d(0, 0, 0);
      }
      100% {
        transform: translate3d(-50%, 0, 0);
      }
    }

    .marquee-slider-track {
      display: flex;
      width: max-content;
      animation: slideLeftInfinite 24s linear infinite;
      will-change: transform;
    }

    /* Gradient edge masks for smooth fade in/out */
    .slider-edge-fade {
      mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
    }
  </style>

  <script>
    function enterSite(destination) {
      try {
        sessionStorage.setItem('almurafaqa_welcome_seen', 'true');
      } catch (e) {}
      const target = destination || 'index.html';
      const separator = target.includes('?') ? '&' : '?';
      window.location.href = target.includes('#')
        ? target.replace('#', separator + 'entered=true#')
        : target + separator + 'entered=true';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a').forEach((link) => {
        link.addEventListener('click', (e) => {
          try {
            sessionStorage.setItem('almurafaqa_welcome_seen', 'true');
          } catch (err) {}
          const href = link.getAttribute('href');
          if (href && !href.startsWith('http') && !href.startsWith('//')) {
            e.preventDefault();
            enterSite(href);
          }
        });
      });
    });
  </script>
