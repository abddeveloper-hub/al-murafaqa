<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Appointments | Team Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <ion-icon name="people"></ion-icon>
                </div>
                <h2>abdsite Hub</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Dashboard</span>
                </a>
                <a href="manage-roster.html" class="nav-item">
                    <ion-icon name="people-outline"></ion-icon>
                    <span>Manage Roster</span>
                </a>
                <a href="program-assignments.html" class="nav-item active">
                    <ion-icon name="trophy-outline"></ion-icon>
                    <span>Program Appointments</span>
                </a>
                <a href="team-results.html" class="nav-item">
                    <ion-icon name="podium-outline"></ion-icon>
                    <span>Team Results</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='../login.html'">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="assign-search" placeholder="Search assignments..." onkeyup="renderAssignments()">
                </div>

                <div class="header-actions">
                    <div class="team-identity" id="team-identity-header" style="font-weight: 800; color: var(--accent-purple); background: var(--accent-purple-glow); padding: 8px 16px; border-radius: 12px; font-size: 0.85rem;">
                        Loading Team...
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="header-title" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 40px;">
                    <div>
                        <h1>Program Appointments</h1>
                        <p>Assign your team members to specific competition programmes.</p>
                    </div>
                    <button class="btn-primary" onclick="openModal('assignModal')">
                        <ion-icon name="add-outline"></ion-icon> New Appointment
                    </button>
                </div>

                <div class="glass-card">
                    <div class="table-responsive" style="padding: 24px;">
                        <table class="activity-table">
                            <thead>
                                <tr>
                                    <th>Candidate</th>
                                    <th>Program Assigned</th>
                                    <th>Category</th>
                                    <th style="text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="assignments-body">
                                <!-- Dynamically filled -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Assign Modal -->
    <div class="modal-overlay" id="assignModal">
        <div class="glass-card modal">
            <div class="modal-header">
                <h2>Appoint Candidate</h2>
                <button class="btn-close" onclick="closeModal('assignModal')">&times;</button>
            </div>
            <form onsubmit="handleAssignSubmit(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Select Candidate</label>
                        <select id="a-candidate" class="form-control" required>
                            <!-- Filtered team candidates -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select Programme</label>
                        <select id="a-program" class="form-control" required>
                            <!-- Available programmes -->
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal('assignModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Confirm Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/main.js"></script>
    <script>
        let candidatesList = [];
        let programmesList = [];
        let appointmentsList = [];
        let teamName = "";

        function initialize() {
            const user = JSON.parse(localStorage.getItem('compete_logged_in_user') || '{}');
            const managers = JSON.parse(localStorage.getItem('compete_managers') || '[]');
            const managerData = managers.find(m => m.email === user.email);
            teamName = user.team || (managerData ? managerData.team : (window.getManagerTeam ? window.getManagerTeam(user.email) : 'Red Team'));
            document.getElementById('team-identity-header').textContent = teamName;

            candidatesList = JSON.parse(localStorage.getItem('compete_candidates') || localStorage.getItem('compete_participants') || '[]');
            programmesList = JSON.parse(localStorage.getItem('compete_programmes') || localStorage.getItem('compete_competitions') || '[]');
            appointmentsList = JSON.parse(localStorage.getItem('compete_appointments') || '[]');

            populateDropdowns();
            renderAssignments();
        }

        function populateDropdowns() {
            const candSelect = document.getElementById('a-candidate');
            const progSelect = document.getElementById('a-program');

            candSelect.innerHTML = '<option value="" disabled selected>Select a candidate</option>';
            candidatesList.filter(c => c.team === teamName).forEach(c => {
                candSelect.innerHTML += `<option value="${c.name}">${c.name} (${c.section})</option>`;
            });

            progSelect.innerHTML = '<option value="" disabled selected>Select a programme</option>';
            programmesList.forEach(p => {
                // Find how many already assigned
                const assignedCount = appointmentsList.filter(a => a.program === p.name).length;
                const remaining = p.slots - assignedCount;
                if (remaining > 0) {
                    progSelect.innerHTML += `<option value="${p.name}|${p.category}">${p.name} [${remaining} slots left]</option>`;
                } else {
                    progSelect.innerHTML += `<option value="" disabled>${p.name} [FULL]</option>`;
                }
            });
        }

        function renderAssignments() {
            const tbody = document.getElementById('assignments-body');
            tbody.innerHTML = '';

            const searchVal = document.getElementById('assign-search').value.toLowerCase();

            const filtered = appointmentsList.filter(a =>
                a.team === teamName && (a.candidate.toLowerCase().includes(searchVal) || a.program.toLowerCase().includes(searchVal))
            );

            filtered.forEach((a, idx) => {
                const originalIdx = appointmentsList.indexOf(a);
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${a.candidate}</strong></td>
                        <td><span class="status-badge" style="background:rgba(99,102,241,0.1); color:var(--accent-purple);">${a.program}</span></td>
                        <td>${a.category}</td>
                        <td style="text-align: right;">
                            <button class="btn-text" style="color:var(--accent-red);" onclick="deleteAppointment(${originalIdx})"><ion-icon name="trash-outline"></ion-icon></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function handleAssignSubmit(e) {
            e.preventDefault();
            const progInfo = document.getElementById('a-program').value.split('|');
            const newAssign = {
                candidate: document.getElementById('a-candidate').value,
                program: progInfo[0],
                category: progInfo[1],
                team: teamName
            };

            // Check for duplicate candidate in same program
            const exists = appointmentsList.some(a => a.candidate === newAssign.candidate && a.program === newAssign.program);
            if (exists) {
                window.showToast('Candidate is already assigned to this programme.', 'error');
                return;
            }

            appointmentsList.push(newAssign);
            localStorage.setItem('compete_appointments', JSON.stringify(appointmentsList));

            // Also update candidate assignment in roster
            candidatesList.forEach(c => {
                if (c.name === newAssign.candidate) {
                    c.comp = newAssign.program;
                    c.assignment = newAssign.program;
                }
            });
            localStorage.setItem('compete_candidates', JSON.stringify(candidatesList));
            if (window.syncParticipants) {
                window.syncParticipants(candidatesList);
            }
            if (window.logSystemActivity) {
                window.logSystemActivity(`Manager assigned ${newAssign.candidate} to ${newAssign.program} (${teamName})`);
            }

            closeModal('assignModal');
            e.target.reset();
            populateDropdowns();
            renderAssignments();
            window.showToast('Appointment confirmed and synced!');
        }

        function deleteAppointment(idx) {
            if (confirm('Cancel this programme appointment?')) {
                appointmentsList.splice(idx, 1);
                localStorage.setItem('compete_appointments', JSON.stringify(appointmentsList));
                populateDropdowns();
                renderAssignments();
                window.showToast('Appointment cancelled.', 'info');
            }
        }

        window.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
