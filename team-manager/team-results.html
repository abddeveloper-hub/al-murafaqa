<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Results | Team Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <ion-icon name="people"></ion-icon>
                </div>
                <h2>abdsite Hub</h2>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Dashboard</span>
                </a>
                <a href="manage-roster.html" class="nav-item">
                    <ion-icon name="people-outline"></ion-icon>
                    <span>Manage Roster</span>
                </a>
                <a href="program-assignments.html" class="nav-item">
                    <ion-icon name="trophy-outline"></ion-icon>
                    <span>Program Appointments</span>
                </a>
                <a href="team-results.html" class="nav-item active">
                    <ion-icon name="podium-outline"></ion-icon>
                    <span>Team Results</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='../login.html'">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="result-search" placeholder="Search results..." onkeyup="renderResults()">
                </div>

                <div class="header-actions">
                    <div class="team-identity" id="team-identity-header" style="font-weight: 800; color: var(--accent-purple); background: var(--accent-purple-glow); padding: 8px 16px; border-radius: 12px; font-size: 0.85rem;">
                        Loading Team...
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="header-title">
                    <h1>Published Rankings</h1>
                    <p>Track the official scores and ranks for your team members.</p>
                </div>

                <div class="glass-card">
                    <div class="table-responsive" style="padding: 24px;">
                        <table class="activity-table">
                            <thead>
                                <tr>
                                    <th>Candidate</th>
                                    <th>Programme</th>
                                    <th>Score</th>
                                    <th>Grade</th>
                                    <th>Team Contribution</th>
                                </tr>
                            </thead>
                            <tbody id="results-body">
                                <!-- Dynamically filled -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/main.js"></script>
    <script>
        let resultsList = [];
        let teamName = "";

        function initialize() {
            const user = JSON.parse(localStorage.getItem('compete_logged_in_user') || '{}');
            const managers = JSON.parse(localStorage.getItem('compete_managers') || '[]');
            const managerData = managers.find(m => m.email === user.email);
            teamName = user.team || (managerData ? managerData.team : (window.getManagerTeam ? window.getManagerTeam(user.email) : 'Red Team'));
            document.getElementById('team-identity-header').textContent = teamName;

            resultsList = JSON.parse(localStorage.getItem('compete_results') || '[]');
            if (resultsList.length === 0) {
                const published = JSON.parse(localStorage.getItem('compete_published_results') || '[]');
                if (Array.isArray(published)) {
                    resultsList = published;
                }
            }
            renderResults();
        }

        function renderResults() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = '';

            const searchVal = (document.getElementById('result-search').value || '').toLowerCase();

            const filtered = resultsList.filter(r =>
                r.team && r.team.toLowerCase() === teamName.toLowerCase() && 
                ((r.name && r.name.toLowerCase().includes(searchVal)) || (r.prog && r.prog.toLowerCase().includes(searchVal)))
            );

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">No published results found for your team yet. Scores appear once published from the Scoring Desk.</td></tr>';
                return;
            }

            filtered.forEach((r, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <div class="user-cell">
                                <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=random" class="avatar" style="width:32px; height:32px;">
                                <strong>${r.name}</strong>
                            </div>
                        </td>
                        <td>${r.prog}</td>
                        <td><span style="font-weight:800; font-size:1.1rem; color:var(--accent-purple);">${r.score}</span></td>
                        <td><span class="status-badge success">${r.grade}</span></td>
                        <td><span style="font-weight:700; color:var(--accent-green);">+${Math.floor(r.score / 10)} pts</span></td>
                    </tr>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
