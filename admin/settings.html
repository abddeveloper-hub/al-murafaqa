<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <ion-icon name="trophy"></ion-icon>
                </div>
                <h2 id="sidebar-brand-name">abdsite Hub</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Overview</span>
                </a>
                <a href="competitions.html" class="nav-item">
                    <ion-icon name="trophy-outline"></ion-icon>
                    <span>Competitions</span>
                </a>
                <a href="teams.html" class="nav-item">
                    <ion-icon name="people-circle-outline"></ion-icon>
                    <span>House Teams</span>
                </a>
                <a href="user-management.html" class="nav-item">
                    <ion-icon name="person-add-outline"></ion-icon>
                    <span>Manage Managers</span>
                </a>
                <a href="judge-management.html" class="nav-item">
                    <ion-icon name="medal-outline"></ion-icon>
                    <span>Manage Judges</span>
                </a>
                <a href="participants.html" class="nav-item">
                    <ion-icon name="people-outline"></ion-icon>
                    <span>Participants</span>
                </a>
                <a href="results.html" class="nav-item">
                    <ion-icon name="podium-outline"></ion-icon>
                    <span>Scoring Desk</span>
                </a>
                <a href="data-management.html" class="nav-item">
                    <ion-icon name="server-outline"></ion-icon>
                    <span>Data Management</span>
                </a>
                <div style="margin: 20px 20px 10px; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">System</div>
                <a href="../super-admin/system-logs.html" class="nav-item">
                    <ion-icon name="list-outline"></ion-icon>
                    <span>Audit Logs</span>
                </a>
                <a href="settings.html" class="nav-item active">
                    <ion-icon name="settings-outline"></ion-icon>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='../login.html'">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" placeholder="Search preferences...">
                </div>

                <div class="header-actions">
                    <button class="notification-btn">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">3</span>
                    </button>
                    
                    <div class="admin-profile">
                        <img id="admin-avatar-img" src="https://ui-avatars.com/api/?name=Admin&background=7c3aed&color=fff" alt="Admin" class="avatar">
                        <div class="profile-info">
                            <span class="name" id="admin-header-name">Admin User</span>
                            <span class="role">Admin</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="header-title" style="margin-bottom: 30px;">
                    <h1>System & Account Settings</h1>
                    <p>Manage your profile, security, and institution branding.</p>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px;">
                    <!-- Admin Profile Card -->
                    <div class="glass-card" style="padding: 32px;">
                        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                            <ion-icon name="person-outline" style="color: var(--accent-purple);"></ion-icon> Administrator Profile
                        </h2>
                        <form onsubmit="saveProfileSettings(event)">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="admin-name" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="admin-email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>New Password (Optional)</label>
                                <input type="password" id="admin-password" class="form-control" placeholder="Leave blank to keep current">
                            </div>
                            <button type="submit" class="btn-primary" style="margin-top: 10px;">Save Profile</button>
                        </form>
                    </div>

                    <!-- Institution Branding Card -->
                    <div class="glass-card" style="padding: 32px;">
                        <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                            <ion-icon name="business-outline" style="color: var(--accent-purple);"></ion-icon> Institution Branding
                        </h2>
                        <form onsubmit="saveBrandingSettings(event)">
                            <div class="form-group">
                                <label>Institution / Festival Name</label>
                                <input type="text" class="form-control" id="inst-name" required>
                            </div>
                            <div class="form-group">
                                <label>Platform Tagline</label>
                                <input type="text" class="form-control" id="inst-tagline" required>
                            </div>
                            <div class="form-group">
                                <label>Event Year</label>
                                <input type="number" class="form-control" id="inst-year" value="2026">
                            </div>
                            <button type="submit" class="btn-primary" style="margin-top: 10px;">Update Branding</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/main.js"></script>
    <script>
        function loadSettings() {
            // Load user profile
            const user = JSON.parse(localStorage.getItem('compete_logged_in_user') || '{}');
            const adminName = user.name || 'Lead Administrator';
            const adminEmail = user.email || 'admin@abdsite.com';

            document.getElementById('admin-name').value = adminName;
            document.getElementById('admin-email').value = adminEmail;
            document.getElementById('admin-header-name').textContent = adminName;
            document.getElementById('admin-avatar-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(adminName)}&background=7c3aed&color=fff`;

            // Load branding
            const instName = localStorage.getItem('compete_platform_name') || 'abdsite Hub';
            const instTagline = localStorage.getItem('compete_platform_tagline') || 'Elevate Your Competitive Edge';
            const instYear = localStorage.getItem('compete_platform_year') || '2026';

            document.getElementById('inst-name').value = instName;
            document.getElementById('inst-tagline').value = instTagline;
            document.getElementById('inst-year').value = instYear;
            document.getElementById('sidebar-brand-name').textContent = instName;
        }

        function saveProfileSettings(e) {
            e.preventDefault();
            const name = document.getElementById('admin-name').value.trim();
            const email = document.getElementById('admin-email').value.trim();
            const pass = document.getElementById('admin-password').value.trim();

            let user = JSON.parse(localStorage.getItem('compete_logged_in_user') || '{}');
            user.name = name;
            user.email = email;
            if (pass) {
                user.pass = pass;
            }
            user.role = user.role || 'admin';
            localStorage.setItem('compete_logged_in_user', JSON.stringify(user));

            document.getElementById('admin-header-name').textContent = name;
            document.getElementById('admin-avatar-img').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=7c3aed&color=fff`;

            if (window.logSystemActivity) {
                window.logSystemActivity(`Admin updated profile settings (${name})`);
            }
            window.showToast('Profile updated successfully!');
        }

        function saveBrandingSettings(e) {
            e.preventDefault();
            const name = document.getElementById('inst-name').value.trim();
            const tagline = document.getElementById('inst-tagline').value.trim();
            const year = document.getElementById('inst-year').value.trim();

            localStorage.setItem('compete_platform_name', name);
            localStorage.setItem('compete_platform_tagline', tagline);
            localStorage.setItem('compete_platform_year', year);

            document.getElementById('sidebar-brand-name').textContent = name;

            if (window.logSystemActivity) {
                window.logSystemActivity(`Admin updated institution branding to "${name}"`);
            }
            window.showToast('Institution branding updated successfully!');
        }

        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
