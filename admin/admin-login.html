<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festie - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/main.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1b26 0%, #24283b 100%);
            color: #fff;
        }
        .login-card {
            background: rgba(30, 31, 41, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-card h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .btn-admin {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-admin:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-judge {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-judge:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-card">
        <ion-icon name="color-filter-outline" style="font-size: 4rem; color: #3b82f6; margin-bottom: 20px;"></ion-icon>
        <h1>Festie.app</h1>
        <p>Festival Management System</p>

        <button class="btn-login btn-admin" onclick="window.location.href='competitions.html?role=admin'">
            <ion-icon name="shield-checkmark-outline"></ion-icon> Login as Administrator
        </button>
        <button class="btn-login btn-judge" onclick="window.location.href='competitions.html?role=judge'">
            <ion-icon name="create-outline"></ion-icon> Login as Judge / Evaluator
        </button>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
