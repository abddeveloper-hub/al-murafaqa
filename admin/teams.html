<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Teams | abdsite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        .team-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        .team-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="logo">
                    <ion-icon name="trophy"></ion-icon>
                </div>
                <h2>abdsite Hub</h2>
            </div>
            
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item">
                    <ion-icon name="grid-outline"></ion-icon>
                    <span>Overview</span>
                </a>
                <a href="competitions.html" class="nav-item">
                    <ion-icon name="trophy-outline"></ion-icon>
                    <span>Competitions</span>
                </a>
                <a href="teams.html" class="nav-item active">
                    <ion-icon name="people-circle-outline"></ion-icon>
                    <span>House Teams</span>
                </a>
                <a href="user-management.html" class="nav-item">
                    <ion-icon name="person-add-outline"></ion-icon>
                    <span>Manage Managers</span>
                </a>
                <a href="judge-management.html" class="nav-item">
                    <ion-icon name="medal-outline"></ion-icon>
                    <span>Manage Judges</span>
                </a>
                <a href="participants.html" class="nav-item">
                    <ion-icon name="people-outline"></ion-icon>
                    <span>Participants</span>
                </a>
                <a href="results.html" class="nav-item">
                    <ion-icon name="podium-outline"></ion-icon>
                    <span>Scoring Desk</span>
                </a>
                <a href="data-management.html" class="nav-item">
                    <ion-icon name="server-outline"></ion-icon>
                    <span>Data Management</span>
                </a>
                <div style="margin: 20px 20px 10px; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">System</div>
                <a href="../super-admin/system-logs.html" class="nav-item">
                    <ion-icon name="list-outline"></ion-icon>
                    <span>Audit Logs</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <ion-icon name="settings-outline"></ion-icon>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <button class="logout-btn" onclick="window.location.href='../login.html'">
                    <ion-icon name="log-out-outline"></ion-icon>
                    <span>Log Out</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <ion-icon name="search-outline"></ion-icon>
                    <input type="text" id="team-search" placeholder="Search teams or leaders..." onkeyup="renderTeams()">
                </div>

                <div class="header-actions">
                    <button class="notification-btn">
                        <ion-icon name="notifications-outline"></ion-icon>
                        <span class="badge">3</span>
                    </button>
                    
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=7c3aed&color=fff" alt="Admin" class="avatar">
                        <div class="profile-info">
                            <span class="name">Admin User</span>
                            <span class="role">Admin</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content">
                <div class="header-title" style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 40px; flex-wrap:wrap; gap:20px;">
                    <div>
                        <h1>House Teams Management</h1>
                        <p>Configure team structures, assign leaders, and monitor performance.</p>
                    </div>
                    <button class="btn-primary" onclick="openModal('teamModal')">
                        <ion-icon name="add-outline"></ion-icon> Create New Team
                    </button>
                </div>

                <div id="teams-grid" class="team-card-grid">
                    <!-- Cards will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Team Modal -->
    <div class="modal-overlay" id="teamModal">
        <div class="glass-card modal">
            <div class="modal-header">
                <h2>Create New Team</h2>
                <button class="btn-close" onclick="closeModal('teamModal')">&times;</button>
            </div>
            <form onsubmit="handleTeamSubmit(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Team Name</label>
                        <input type="text" id="t-name" class="form-control" placeholder="e.g. Red Team" required>
                    </div>
                    <div class="form-group">
                        <label>Department / Unit</label>
                        <input type="text" id="t-dept" class="form-control" placeholder="e.g. Faculty of Arts" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label>Institution Contact Person</label>
                            <input type="text" id="t-contact" class="form-control" placeholder="e.g. Dr. Sarah Miller" required>
                        </div>
                        <div class="form-group">
                            <label>Registration Year</label>
                            <input type="number" id="t-year" class="form-control" value="2026" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Official Motto / Tagline</label>
                        <input type="text" id="t-motto" class="form-control" placeholder="e.g. Excellence in Action">
                    </div>
                    <div class="form-group">
                        <label>Team Leader / Captain (Initial)</label>
                        <input type="text" id="t-leader" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModal('teamModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Create Team</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="../js/main.js"></script>
    <script>
        let teamsList = [];

        function initializeTeams() {
            const saved = localStorage.getItem('compete_teams');
            if (saved) {
                teamsList = JSON.parse(saved);
            } else {
                teamsList = [
                    { name: "Red Team", leader: "Ahmed Hassan", members: 45 },
                    { name: "Blue Team", leader: "Sarah Miller", members: 52 },
                    { name: "Green Team", leader: "Raj Kumar", members: 38 }
                ];
                localStorage.setItem('compete_teams', JSON.stringify(teamsList));
            }
            renderTeams();
        }

        function renderTeams() {
            const grid = document.getElementById('teams-grid');
            grid.innerHTML = '';
            
            const search = (document.getElementById('team-search').value || '').toLowerCase();
            const participants = JSON.parse(localStorage.getItem('compete_participants') || localStorage.getItem('compete_candidates') || '[]');

            const filtered = teamsList.filter(t =>
                (t.name && t.name.toLowerCase().includes(search)) || 
                (t.leader && t.leader.toLowerCase().includes(search))
            );

            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No house teams found. Click "Create New Team" to add one.</div>';
                return;
            }

            filtered.forEach((t) => {
                const originalIdx = teamsList.indexOf(t);
                const actualMembersCount = participants.filter(p => p.team && p.team.toLowerCase() === t.name.toLowerCase()).length;
                const displayCount = actualMembersCount > 0 ? actualMembersCount : (t.members || 0);

                grid.innerHTML += `
                    <div class="card glass-card team-card">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                            <h2 style="font-size:1.25rem; font-weight:800;">${t.name}</h2>
                            <span class="status-badge success" style="font-size: 0.75rem;">Active</span>
                        </div>
                        <p style="color:var(--text-muted); font-size:0.9rem;">Leader: <strong style="color:var(--text-primary);">${t.leader || 'Not Assigned'}</strong></p>
                        <p style="color:var(--text-muted); font-size:0.9rem;">Total Members: <strong style="color:var(--accent-purple); font-size:1.1rem;">${displayCount}</strong></p>
                        ${t.dept ? `<p style="color:var(--text-muted); font-size:0.85rem;">Dept: ${t.dept}</p>` : ''}
                        <div style="margin-top:auto; display:flex; gap:10px; padding-top: 10px;">
                            <button class="btn-primary" style="flex:1; padding:8px; font-size:0.8rem;" onclick="window.location.href='user-management.html'">Manage Managers</button>
                            <button class="btn-danger" style="padding:8px;" onclick="deleteTeam(${originalIdx})" title="Delete Team"><ion-icon name="trash-outline"></ion-icon></button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function handleTeamSubmit(e) {
            e.preventDefault();
            const newTeam = {
                name: document.getElementById('t-name').value.trim(),
                dept: document.getElementById('t-dept').value.trim(),
                contact: document.getElementById('t-contact').value.trim(),
                year: document.getElementById('t-year').value.trim(),
                motto: document.getElementById('t-motto').value.trim(),
                leader: document.getElementById('t-leader').value.trim(),
                members: 0
            };
            teamsList.push(newTeam);
            localStorage.setItem('compete_teams', JSON.stringify(teamsList));
            if (window.logSystemActivity) {
                window.logSystemActivity(`Admin created new House Team: ${newTeam.name} (Leader: ${newTeam.leader})`);
            }
            closeModal('teamModal');
            e.target.reset();
            renderTeams();
            window.showToast('Team created successfully!');
        }

        function deleteTeam(idx) {
            if (idx < 0 || idx >= teamsList.length) return;
            const team = teamsList[idx];
            if (confirm(`Permanently delete team "${team.name}"?`)) {
                teamsList.splice(idx, 1);
                localStorage.setItem('compete_teams', JSON.stringify(teamsList));
                if (window.logSystemActivity) {
                    window.logSystemActivity(`Admin deleted House Team: ${team.name}`);
                }
                renderTeams();
                window.showToast('Team removed.', 'info');
            }
        }

        window.addEventListener('DOMContentLoaded', initializeTeams);
    </script>
</body>
</html>
